<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bang Search</title>
<meta name="description" content="Search every available !bang shortcut by name, code or category.">
<meta name="theme-color" content="#141414">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚡</text></svg>">
<!-- Warm up the connection for the index fetch that starts as soon as the script runs. -->
<link rel="preload" href="__SEARCH_JS__" as="script">
<style>
  :root {
    --background: #141414;
    --foreground: #ebebeb;
    --text-primary: #d4d4d8;
    --text-secondary: #737373;
    --border-color: #404040;
    --border-subtle: #262626;
    --hover-bg: rgba(64, 64, 64, .2);
    --kbd-background: #222;
    --accent: #6c63ff;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--background); color: var(--foreground);
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
    font-family: var(--font-sans); line-height: 1.5; padding: 1rem;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    display: flex; flex-direction: column; width: 100%; max-width: 700px;
    min-height: min(250px, 40vh); max-height: min(600px, 90vh);
    border: 1px solid var(--border-color); border-radius: 12px;
    padding: clamp(1rem, 5vw, 2rem);
  }
  header { text-align: center; margin-bottom: clamp(1rem, 4vh, 2rem); }
  h1 { font-size: clamp(1.5rem, 5vw, 2.2rem); color: var(--text-primary); font-weight: 700; letter-spacing: -.5px; }
  .description { color: var(--text-secondary); font-size: clamp(.8rem, 2vw, .9rem); margin-top: .4rem; font-family: var(--font-mono); }
  input[type="text"] {
    width: 100%; height: 44px; padding: 0 clamp(14px, 4vw, 20px);
    font-size: 16px; font-family: var(--font-mono);
    border: 1px solid var(--border-subtle); border-radius: 8px; outline: none;
    background-color: var(--background); color: var(--text-primary);
  }
  input[type="text"]:focus { border-color: var(--text-secondary); }
  input[type="text"]::placeholder { color: var(--text-secondary); }
  .results {
    flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 10px; overflow-y: auto; margin-top: 15px; padding-right: 4px; min-height: 60px;
    /* Reserve the scrollbar so results appearing never reflow the container. */
    scrollbar-gutter: stable;
  }
  .results::-webkit-scrollbar { width: 6px; }
  .results::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 3px; }
  .bang-chip {
    background-color: var(--hover-bg); border: 1px solid var(--border-subtle); border-radius: 8px;
    padding: clamp(10px, 2vw, 12px) clamp(12px, 3vw, 16px);
    display: flex; align-items: center; gap: 12px; height: 60px; width: 100%;
    cursor: pointer; text-align: left; color: inherit; font: inherit;
    /* Transform/opacity only — no layout-affecting properties. */
    transition: border-color .15s ease, transform .15s ease;
  }
  .bang-chip:hover { border-color: var(--border-color); transform: translateY(-2px); }
  .bang-chip.copied { border-color: var(--accent); }
  .bang-code {
    background-color: var(--kbd-background); color: var(--text-primary);
    border: 1px solid var(--border-subtle); border-radius: 5px;
    padding: 2px 8px; font-size: clamp(11px, 2vw, 13px); font-family: var(--font-mono); white-space: nowrap;
  }
  .bang-chip.copied .bang-code { border-color: var(--accent); color: var(--accent); }
  .bang-info { flex: 1; min-width: 0; }
  .bang-name { font-weight: 600; font-size: clamp(.8rem, 2.2vw, .9rem); color: var(--text-primary); }
  .bang-domain { color: var(--text-secondary); font-size: clamp(.7rem, 1.8vw, .75rem); font-family: var(--font-mono); }
  .bang-name, .bang-domain { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .no-results {
    grid-column: 1 / -1; text-align: center; color: var(--text-secondary);
    padding: clamp(1rem, 3vw, 2rem); border: 1px dashed var(--border-subtle); border-radius: 8px;
    font-size: clamp(.85rem, 2.2vw, 1rem); min-height: 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .back { display: block; text-align: center; margin-top: 1rem; font-size: .75rem; color: var(--text-secondary); text-decoration: none; }
  .back:hover { color: var(--text-primary); text-decoration: underline; }
  @media (max-width: 480px) {
    .results { grid-template-columns: 1fr; gap: 8px; }
    .container { padding: 1rem; border-radius: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bang-chip { transition: none; }
    .bang-chip:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Bang Search</h1>
      <p class="description">Find and use bang shortcuts</p>
    </header>
    <input type="text" id="search-input" placeholder="Search by name, code or category…" autocomplete="off" spellcheck="false" autocapitalize="off">
    <div class="results" id="results-container" aria-live="polite"></div>
    <a class="back" href="/">← back to e108 !Bangs</a>
  </div>
  <script src="__SEARCH_JS__" defer></script>
</body>
</html>
